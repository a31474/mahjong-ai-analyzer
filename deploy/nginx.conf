# mcr-ai 反向代理模板（mahjong-ai-analyzer）
#
# 安装：把 <DOMAIN> / <CERT> / <KEY> 换成实际值后放到 /etc/nginx/conf.d/mcr-ai.conf
#   nginx -t && systemctl reload nginx
#
# 兼容性：http2 on; 需要 nginx >= 1.25.1；旧版本改成 `listen 443 ssl http2;`
# 检查主配置是否已开启 gzip（本文件里的 gzip_* 若不配 gzip on 不生效）：
#   nginx -T | grep -E "gzip on|gzip_types"
#
# 注意：本文件不含其他站点自有的 location（例如静态下载），合并时保留它们即可。

gzip on;
gzip_min_length 1k;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 单核 CPU 的瓶颈是 AI 推理，必须限速防刷
limit_req_zone $binary_remote_addr zone=mcr_prepare:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=mcr_step:10m rate=60r/m;

server {
    listen 80;
    server_name <DOMAIN>;

    # certbot --nginx / webroot 签发证书时的校验路径（不用 certbot 可删）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # HTTP 一律跳 HTTPS（避免明文访问时后端仍可被刷）
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;
    ssl_certificate     <CERT>;
    ssl_certificate_key <KEY>;

    client_max_body_size 20m;      # 上传大牌谱 JSON
    server_tokens off;

    # AI 接口按 IP 限速（burst 给少量抖动余量，nodelay 立即放行限速内请求）
    location /api/analyze/prepare {
        limit_req zone=mcr_prepare burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;    # 拉取平台牌谱可能较慢
    }
    location /api/analysis/ {
        limit_req zone=mcr_step burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    # 健康检查：不限速、不记日志
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # Vite 产物文件名带内容 hash，可长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # 牌面/音效资源文件名不带 hash（11.svg / 51.svg…）：短缓存 + ETag 校验，
    # 换牌面后最多 1 天生效；若刚更新过牌面，可临时改成 no-cache 让用户立刻拿到新图
    location /game2d-assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # 其余全部代理到后端（index.html / 其余 assets / records / API）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
